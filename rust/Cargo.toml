[package]
name = "snarl-shacl"
version = "0.4.2"
edition = "2021"
description = "Rust bindings for the Snarl SHACL validator"
license = "Apache-2.0"
repository = "https://github.com/Trivyn/snarl"
keywords = ["shacl", "rdf", "validation", "semantic-web"]
categories = ["science", "algorithms"]
readme = "README.md"
include = [
    "src/**/*",
    "tests/**/*",
    "csrc/**/*",
    "csrc_shim.c",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[lib]
name = "snarl"

[build-dependencies]
cc = "1"
